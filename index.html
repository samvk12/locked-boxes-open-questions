<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Locked Boxes, Open Questions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Palette: plum and aubergine desk, verdigris labels, muted berry accents (locks, ribbon, rules), pale verdigris on the cover, ledger-ruled paper. No gold.
   Layout: a real book on a dark desk. Pages turn on a spine into two-page spreads: the right page carries the content, the left page (the back of the page just turned) keeps its key line as an editorial margin note. A lock-and-key motif throughout. One committed look (dark desk, paper pages). */
:root {
  color-scheme: dark;
  --desk: #150F1B;
  --desk-2: #2B1C35;
  --navy: #2E1838;
  --ink: #241A2B;
  --blue: #2B6E62;
  --gold: #A65D7B;
  --gold-deep: #7E3B5A;
  --paper: #F1F2EC;
  --paper-2: #E6E9E1;
  --muted: #665F6B;
  --line: #D3D7CC;
  --teal: #3E8C7E;

  --f-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-label: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(120% 90% at 50% 35%, var(--desk-2) 0%, var(--desk) 62%); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--desk); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* ---------- chrome ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 6px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); font-family: var(--f-label); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #CFC5D3; }
.top b { color: #8CC9BD; font-weight: 700; }
.top .r { display: flex; gap: 10px; align-items: center; }
.ghost-btn { border: 1px solid rgba(140,201,189,.5); background: transparent; color: #E4DDE8; padding: 7px 14px; font-family: var(--f-label); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; min-height: 36px; transition: background .2s, color .2s; }
.ghost-btn:hover { background: var(--gold-deep); color: #FFFFFF; border-color: var(--gold-deep); }
@media (max-width: 640px) { .top .tagline { display: none; } }

.stage { display: grid; place-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 0; }
.book { position: relative; width: min(1180px, 100%); height: min(760px, 100%); perspective: 2600px; transition: transform .9s cubic-bezier(.3,.7,.2,1); }
.book.closed { transform: translateX(-25%); }
.book::after { content: ""; position: absolute; left: 50%; top: 2%; bottom: -3%; width: 50%; background: radial-gradient(60% 50% at 50% 100%, rgba(0,0,0,.45), transparent 70%); z-index: -1; filter: blur(14px); }
.book.open::before { content: ""; position: absolute; left: 0; top: 2%; bottom: -3%; width: 100%; background: radial-gradient(60% 40% at 50% 100%, rgba(0,0,0,.45), transparent 70%); z-index: -1; filter: blur(14px); }
.edge { position: absolute; top: 4px; bottom: 4px; z-index: 0; background: repeating-linear-gradient(90deg, #E6E2D8 0 1px, #CFCAC0 1px 2px); transition: width .6s; border-radius: 0 3px 3px 0; }
.edge.r { left: 100%; }
.edge.l { left: 0; transform: translateX(-100%); border-radius: 3px 0 0 3px; }
.book.closed .edge.l { display: none; }
.ribbon { position: absolute; z-index: 60; top: -8px; right: 46px; width: 22px; height: 110px; background: linear-gradient(90deg, #7E3B5A, var(--gold) 45%, #7E3B5A); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%); box-shadow: 0 6px 10px rgba(0,0,0,.25); pointer-events: none; transition: height .5s; }
.book.closed .ribbon { height: 60px; }

/* leaves */
.leaf { position: absolute; top: 0; bottom: 0; left: 50%; width: 50%; transform-origin: left center; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.35,.6,.2,1); }
.leaf.flipped { transform: rotateY(-180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow-y: auto; overflow-x: hidden; background-color: var(--paper); background-image: repeating-linear-gradient(180deg, transparent 0 27px, rgba(43,110,98,.075) 27px 28px); }
.front .pg:not(.cover)::before { content: ""; position: absolute; left: 24px; top: 0; bottom: 0; width: 1px; background: rgba(166,93,123,.45); box-shadow: 3px 0 0 rgba(166,93,123,.25); }
@media (max-width: 560px) { .front .pg:not(.cover)::before { left: 10px; } }
.front { border-radius: 0 6px 6px 0; box-shadow: inset 14px 0 22px -12px rgba(46,24,56,.28); }
.back { transform: rotateY(180deg); border-radius: 6px 0 0 6px; box-shadow: inset -14px 0 22px -12px rgba(46,24,56,.28); }
.front::after, .back::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.front::after { background: linear-gradient(90deg, rgba(30,16,36,.35), rgba(30,16,36,0) 70%); }
.back::after { background: linear-gradient(270deg, rgba(30,16,36,.35), rgba(30,16,36,0) 70%); }
.leaf.turning .front::after, .leaf.turning .back::after { animation: shade .95s ease; }
@keyframes shade { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
.curl { position: absolute; right: 0; bottom: 0; width: 0; height: 0; background: linear-gradient(135deg, transparent 50%, #E3DED2 50%, #F6F3EC 70%); box-shadow: -4px -4px 8px rgba(0,0,0,.08); transition: width .25s, height .25s; pointer-events: none; z-index: 3; }
.leaf.is-current:not(.last) .front:hover .curl { width: 46px; height: 46px; }
@media (prefers-reduced-motion: reduce) { .leaf, .book { transition: none; } .leaf.turning .front::after, .leaf.turning .back::after { animation: none; } }

/* single-page mode */
@media (max-width: 900px) {
  .book { height: 100%; }
  .book.closed { transform: none; }
  .leaf { left: 0; width: 100%; }
  .leaf.flipped { transform: rotateY(-100deg); opacity: 0; transition: transform .7s cubic-bezier(.35,.6,.2,1), opacity .5s .2s; }
  .back { display: none; }
  .edge.l, .book::after, .book.open::before { display: none; }
  .ribbon { right: 34px; }
  .front { border-radius: 6px; }
}

/* ---------- page content ---------- */
.pg { position: relative; padding: 40px 44px 58px; min-height: 100%; display: flex; flex-direction: column; gap: 0; }
@media (max-width: 560px) { .pg { padding: 28px 22px 54px; } }
.eyebrow { font-family: var(--f-label); font-weight: 700; font-size: 11.5px; letter-spacing: .22em; color: var(--blue); text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--gold); }
.pg h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 3.3vw, 44px); line-height: 1.02; letter-spacing: -.01em; color: var(--navy); margin-bottom: 18px; }
.lead { font-size: 18px; line-height: 1.45; color: #3F3546; margin-bottom: 20px; }
.pg p { font-size: 15px; line-height: 1.55; color: #3F3946; }
.tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--gold); color: var(--gold-deep); padding: 6px 10px; font-family: var(--f-label); font-weight: 700; font-size: 11px; letter-spacing: .16em; margin-bottom: 18px; }
.tag svg { width: 12px; height: 12px; }
.note { font-size: 13px !important; line-height: 1.5; color: var(--muted) !important; margin-top: 16px; font-style: italic; }
.pull { margin-top: 20px; padding: 18px 22px; background: var(--navy); color: #F3ECEF; font-family: var(--f-display); font-size: 21px; line-height: 1.25; position: relative; }
.pull::before { content: "\201C"; position: absolute; left: 12px; top: -14px; font-size: 64px; color: var(--gold); line-height: 1; }
.pull { padding-left: 34px; }
.pagenum { position: absolute; bottom: 18px; right: 26px; font-family: var(--f-label); font-size: 11px; letter-spacing: .2em; color: #8D8691; }
.pagenum.l { right: auto; left: 26px; }

.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.card { background: var(--paper-2); border: 1px solid var(--line); padding: 16px 18px; position: relative; }
.card b { display: block; font-family: var(--f-label); font-weight: 700; font-size: 11px; letter-spacing: .16em; color: var(--blue); margin-bottom: 6px; }
.card p { font-size: 14.5px; }
.card:hover { border-color: var(--gold); }

/* cover */
.cover { background: radial-gradient(ellipse at 82% 18%, #5A3466 0, #3B2246 30%, var(--navy) 68%); color: #FFFFFF; justify-content: space-between; overflow: hidden; }
.cover .eyebrow { color: #8CC9BD; }
.cover .eyebrow::before { background: #8CC9BD; }
.cover h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 5.4vw, 74px); line-height: .95; letter-spacing: -.01em; color: #FFFFFF; position: relative; z-index: 1; }
.cover .sub { font-family: var(--f-display); font-style: italic; font-size: 24px; color: #D9C8E0; margin-top: 10px; position: relative; z-index: 1; }
.cover .question { font-size: 17px !important; line-height: 1.45; color: #F3ECEF !important; max-width: 420px; border-left: 2px solid var(--gold); padding-left: 16px; margin-top: 22px; position: relative; z-index: 1; }
.cover .foot { font-family: var(--f-label); font-size: 11px; letter-spacing: .24em; color: #B9A6C2; position: relative; z-index: 1; }
.vault { position: absolute; right: -70px; top: 70px; width: 360px; height: 360px; pointer-events: none; opacity: .9; }
.vault svg { width: 100%; height: 100%; }
.vault .dial { transform-origin: 180px 180px; animation: dial 18s linear infinite; }
@keyframes dial { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .vault .dial { animation: none; } }
.open-btn { align-self: flex-start; margin-top: 24px; display: inline-flex; align-items: center; gap: 12px; background: var(--gold-deep); color: #FFFFFF; border: 0; padding: 12px 18px; font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; position: relative; z-index: 1; }
.open-btn svg { width: 18px; height: 18px; }
.open-btn .shackle { transition: transform .35s cubic-bezier(.3,1.6,.5,1); transform-origin: 16px 9px; }
.open-btn.unlocked .shackle { transform: translateY(-3px) rotate(-28deg); }

/* inside cover = contents */
.toc h3 { font-family: var(--f-display); font-weight: 400; font-size: 34px; color: var(--navy); margin-bottom: 14px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; }
.toc li button { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; text-align: left; background: transparent; border: 0; border-bottom: 1px dashed #C9CDC1; padding: 9px 2px; color: var(--ink); }
.toc li button:hover { background: rgba(166,93,123,.12); }
.toc .n { font-family: var(--f-label); font-weight: 700; color: var(--gold-deep); font-size: 13px; }
.toc .t { font-family: var(--f-body); font-size: 15px; }
.toc .k { font-family: var(--f-label); font-size: 10.5px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }

/* verso margin note */
.verso { justify-content: center; gap: 18px; }
.verso .big-n { font-family: var(--f-display); font-size: 120px; line-height: .8; color: transparent; -webkit-text-stroke: 1.5px var(--gold); }
.verso .v-eye { font-family: var(--f-label); font-weight: 700; font-size: 11.5px; letter-spacing: .22em; color: var(--blue); text-transform: uppercase; }
.verso blockquote { margin: 0; font-family: var(--f-display); font-size: clamp(24px, 2.4vw, 32px); line-height: 1.2; color: var(--navy); max-width: 30ch; }
.verso .rule { width: 60px; height: 2px; background: var(--gold); }
.verso .sig { font-family: var(--f-label); font-size: 11px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.verso .keyhole { position: absolute; right: 34px; top: 34px; width: 34px; opacity: .35; }

/* locks (page 2) */
.locks { display: grid; gap: 10px; }
.lock { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--paper-2); border: 1px solid var(--line); border-top: 3px solid var(--gold); padding: 14px 16px; transition: border-color .2s, background .2s; }
.lock.off { border-top-color: #B7BEC4; background: #F7F2F0; }
.lockbtn { width: 58px; height: 58px; border: 1px solid var(--line); background: #FFFFFF; display: grid; place-items: center; }
.lockbtn svg { width: 30px; height: 30px; }
.lockbtn .shackle { transition: transform .3s cubic-bezier(.3,1.6,.5,1); transform-origin: 22px 14px; }
.lockbtn[aria-pressed="false"] .shackle { transform: translateY(-5px) rotate(-30deg); }
.lock .num { font-family: var(--f-label); font-weight: 700; color: var(--gold-deep); font-size: 13px; letter-spacing: .1em; }
.lock h3 { font-family: var(--f-label); font-weight: 700; font-size: 15px; letter-spacing: .1em; color: var(--navy); margin: 2px 0 4px; }
.lock-status { margin-top: 12px; padding: 12px 14px; font-family: var(--f-label); font-weight: 600; font-size: 14px; letter-spacing: .04em; display: flex; gap: 10px; align-items: center; }
.lock-status.ok { background: #E7EFEA; color: #2E5E4C; }
.lock-status.no { background: #F6E8E4; color: #8A3A2A; }
.hint { font-family: var(--f-label); font-size: 12px; letter-spacing: .06em; color: var(--muted); margin-top: 8px; }

/* nested boxes (page 3) */
.nest { display: grid; gap: 14px; }
.nest svg { width: 100%; max-width: 420px; height: auto; display: block; }
.nest-box { fill: transparent; stroke: var(--blue); stroke-width: 1.4; transition: fill .25s, stroke .25s; cursor: pointer; }
.nest-box.on { fill: rgba(166,93,123,.22); stroke: var(--gold-deep); stroke-width: 2.4; }
.nest-lab { font-family: var(--f-label); font-weight: 700; font-size: 10px; letter-spacing: .14em; fill: var(--blue); pointer-events: none; }
.layers { display: grid; gap: 6px; }
.layer { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 14px; padding: 11px 14px; background: var(--paper-2); border-left: 4px solid #CDD4D9; text-align: left; border-top: 0; border-right: 0; border-bottom: 0; width: 100%; transition: border-color .2s, background .2s; }
.layer.on { border-left-color: var(--gold); background: #F1E3EA; }
.layer b { font-family: var(--f-label); font-weight: 700; font-size: 11px; letter-spacing: .14em; color: var(--blue); align-self: center; }
.layer span { font-size: 14px; line-height: 1.4; color: var(--ink); }
.layer small { display: block; color: var(--muted); font-family: var(--f-label); font-size: 12px; letter-spacing: .04em; margin-top: 3px; }
@media (max-width: 560px) { .layer { grid-template-columns: 96px minmax(0, 1fr); } }

/* chart (page 5) */
.chart { display: grid; gap: 14px; margin: 10px 0 6px; }
.barrow { display: grid; grid-template-columns: 120px minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-family: var(--f-label); font-size: 13px; letter-spacing: .04em; }
.track { height: 30px; background: repeating-linear-gradient(90deg, transparent 0 calc(20% - 1px), #D5DADD calc(20% - 1px) 20%); background-color: #ECEFF0; position: relative; }
.fill { height: 100%; width: 0; background: var(--blue); transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
.barrow:nth-child(2) .fill { background: var(--gold); }
.barrow strong { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--navy); }
.axis { display: grid; grid-template-columns: 120px minmax(0, 1fr) 56px; gap: 12px; font-family: var(--f-label); font-size: 11px; color: var(--muted); }
.axis div { display: flex; justify-content: space-between; }
@media (max-width: 560px) { .barrow, .axis { grid-template-columns: 88px minmax(0, 1fr) 46px; } }

/* timeline (page 6) */
.timeline { display: grid; margin-top: 4px; }
.event { display: grid; grid-template-columns: 18px 108px minmax(0, 1fr); gap: 12px; padding: 12px 0; position: relative; }
.event::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: #D6DCE0; }
.event:first-child::before { top: 18px; } .event:last-child::before { bottom: calc(100% - 18px); }
.event i { width: 18px; height: 18px; border-radius: 50%; background: var(--paper); border: 3px solid var(--gold); position: relative; z-index: 1; margin-top: 1px; }
.event b { font-family: var(--f-label); font-weight: 700; font-size: 11.5px; letter-spacing: .12em; color: var(--blue); padding-top: 2px; }
.event span { font-size: 14.5px; line-height: 1.45; }
@media (max-width: 560px) { .event { grid-template-columns: 18px minmax(0, 1fr); } .event span { grid-column: 2; } }

/* compare (page 8) */
.compare { display: grid; gap: 10px; }
.compare .card { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 14px; align-items: start; }
.mono { width: 54px; height: 54px; border-radius: 50%; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; }
.compare em { display: inline-block; margin-top: 8px; font-family: var(--f-label); font-style: normal; font-weight: 700; font-size: 11px; letter-spacing: .14em; color: var(--gold-deep); border-top: 1px solid var(--gold); padding-top: 6px; }

/* actions (page 9) */
.actions { display: grid; gap: 8px; }
.action { display: grid; grid-template-columns: 34px minmax(0, 1fr) 26px; gap: 12px; align-items: start; padding: 12px 14px; background: var(--paper-2); border: 1px solid var(--line); text-align: left; width: 100%; transition: background .2s, border-color .2s; }
.action i { font-family: var(--f-display); font-style: normal; font-size: 22px; color: var(--gold-deep); line-height: 1; }
.action b { font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .12em; display: block; margin-bottom: 4px; color: var(--navy); }
.action span { font-size: 13.5px; line-height: 1.4; color: #4E4753; }
.action .box { width: 24px; height: 24px; border: 1.5px solid var(--blue); display: grid; place-items: center; }
.action[aria-pressed="true"] { background: #EEF3EF; border-color: #A9C1B4; }
.action[aria-pressed="true"] .box { background: var(--teal); border-color: var(--teal); }
.action[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 5px; border-left: 2px solid #FFFFFF; border-bottom: 2px solid #FFFFFF; transform: rotate(-45deg) translate(1px, -1px); }
.readiness { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-family: var(--f-label); font-size: 13px; letter-spacing: .06em; color: var(--navy); }
.readiness .meter { flex: 1; height: 6px; background: #E1E5E7; }
.readiness .meter i { display: block; height: 100%; background: var(--teal); width: 0; transition: width .3s; }

/* sdgs (page 10) */
.sdgs { display: grid; gap: 10px; }
.sdg { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 16px; padding: 14px; background: var(--paper-2); border: 1px solid var(--line); }
.sdg .num { background: #2E1838; color: #FFFFFF; display: grid; place-items: center; align-content: center; font-family: var(--f-display); font-size: 26px; min-height: 74px; line-height: 1; }
.sdg .num small { font-family: var(--f-label); font-size: 9px; letter-spacing: .2em; color: #B9A6C2; margin-bottom: 4px; }
.sdg:nth-child(2) .num { background: #7E3B5A; }
.sdg:nth-child(3) .num { background: var(--teal); }
.sdg b { font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .12em; color: var(--navy); }
.sdg p { margin: 4px 0; font-size: 14px; }
.sdg small.t { font-family: var(--f-label); font-size: 11.5px; letter-spacing: .1em; color: var(--gold-deep); }

/* refs (page 11) */
.refs { padding-left: 18px; margin: 0; display: grid; gap: 8px; }
.refs li { font-size: 13px; line-height: 1.45; color: #4E4753; }
.refs li::marker { color: var(--gold-deep); font-family: var(--f-label); }
.credits { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-family: var(--f-label); font-size: 12.5px; line-height: 1.7; letter-spacing: .05em; color: #5C5561; }

/* nav */

<script>
(function () {
  const pages = [{"eyebrow": "MANAGEMENT OF IP IN DIGITAL MEDIA · GROUP 12", "title": "LOCKED BOXES,<br>OPEN QUESTIONS", "subtitle": "Trade Secrets in the Age of AI", "body": "Can an AI system be both a protected trade secret and an accountable one?", "kind": "cover", "foot": "SHIV NADAR UNIVERSITY · DELHI NCR"}, {"eyebrow": "01 · THE BIG QUESTION", "title": "When secrecy<br>meets accountability", "lead": "AI companies protect valuable information. But what happens when that hidden information shapes decisions about real people?", "blocks": [["THE BUSINESS SIDE", "Training datasets, data-filtering choices and model internals can give an AI developer a competitive advantage. Keeping them confidential can protect investment and innovation."], ["THE PUBLIC SIDE", "When an automated system ranks, recommends, scores or refuses someone, that person may need to understand why. Complete secrecy can make decisions difficult to challenge."], ["THE CENTRAL TENSION", "The question is not simply whether AI should be secret or transparent. It is who should receive which information, and under what safeguards."]], "pull": "The challenge: protect the innovation without hiding the consequences."}, {"eyebrow": "02 · THE LEGAL FOUNDATION", "title": "What makes information<br>a trade secret?", "lead": "Under Article 39(2) of the TRIPS Agreement, information must meet three conditions.", "steps": [["01", "SECRET", "It is not generally known or readily accessible to people who normally deal with this kind of information."], ["02", "COMMERCIAL VALUE", "It has value because it is secret."], ["03", "REASONABLE STEPS", "Its owner has taken reasonable steps to keep it confidential."]], "note": "The EU Trade Secrets Directive (2016/943), Article 2(1), uses the same three-part test.", "pull": "A company cannot simply label information confidential and assume it qualifies."}, {"eyebrow": "03 · THE NEW BALANCE", "title": "Transparency does not<br>have to mean publishing everything", "lead": "The emerging approach is layered disclosure: different audiences receive different levels of information.", "layers": [["PUBLIC", "A sufficiently detailed summary of training content", "AI Act · Article 53(1)(d)"], ["DOWNSTREAM PROVIDERS", "Information about model capabilities and limits", "AI Act · Article 53(1)(b)"], ["REGULATORS", "Technical documentation on request, treated confidentially", "AI Act · Articles 53(1)(a), 53(7)"], ["AFFECTED PEOPLE", "A clear and meaningful explanation of the AI's role and main decision elements", "AI Act · Article 86; CJEU C-203/22"], ["COURTS / AUTHORITIES", "Access to allegedly protected information so competing interests can be balanced", "CJEU C-203/22"]], "pull": "Not everyone needs the formula. But the right people may need enough evidence to test it."}, {"eyebrow": "04 · CASE STUDY", "title": "The algorithm<br>behind the score", "tag": "STATE v. LOOMIS · 2016", "lead": "A criminal court used a COMPAS risk assessment in a sentencing process. The tool's methodology was proprietary.", "blocks": [["WHAT HAPPENED", "Eric Loomis received a sentence after a presentence report included a COMPAS score."], ["THE PROBLEM", "Because the methodology was a trade secret, the court could not examine how the score was calculated or how factors were weighted."], ["THE COURT'S RESPONSE", "The Wisconsin Supreme Court allowed COMPAS to be used in limited ways, but barred it from deciding whether someone should be incarcerated or how severe the sentence should be. It also required written warnings."]], "note": "The case illustrates how secrecy can limit scrutiny even when a score influences a serious decision. Source: Harvard Law Review (2017)."}, {"eyebrow": "05 · THE DATA THAT RAISED QUESTIONS", "title": "One score.<br>Different outcomes.", "tag": "PROPUBLICA · MACHINE BIAS (2016)", "lead": "ProPublica analysed more than 7,000 people arrested in Broward County, Florida, in 2013 and 2014.", "chart": true, "note": "Among defendants who did not re-offend, the share incorrectly labelled higher risk was 44.9% for Black defendants and 23.5% for white defendants. These are the figures reported by ProPublica; they do not by themselves explain every cause of the difference.", "pull": "If people cannot inspect how a system works, identifying and challenging unequal outcomes becomes harder."}, {"eyebrow": "06 · CASE STUDY", "title": "A right to an<br>understandable explanation", "tag": "CK v DUN & BRADSTREET AUSTRIA · C-203/22", "lead": "A customer was refused a €10-per-month mobile contract after an automated credit assessment judged her credit standing insufficient.", "timeline": [["THE DISPUTE", "The customer sought meaningful information about the automated decision."], ["27 FEB 2025", "The Court of Justice of the European Union delivered its ruling."], ["THE PRINCIPLE", "An explanation must help the person understand and challenge the decision. Merely communicating the algorithm is not enough."], ["THE SAFEGUARD", "If trade secrets are claimed, the information must be provided to a competent supervisory authority or court, which balances the competing interests."]], "pull": "“It is a trade secret” is not a complete answer to a request for an explanation."}, {"eyebrow": "07 · CASE STUDY", "title": "How much training-data<br>transparency is too much?", "tag": "xAI v. BONTA · CALIFORNIA AB 2013", "blocks": [["THE LAW", "California AB 2013 requires developers of publicly available generative AI systems to provide a broad overview of training datasets. It took effect on 1 January 2026."], ["THE CHALLENGE", "xAI argued that its datasets were trade secrets and challenged the disclosure requirement."], ["THE COURT'S RULING", "On 4 March 2026, the court denied xAI's motion for a preliminary injunction."], ["STATUS IN THE REPORT", "As at 20 November 2026, the report states that xAI had appealed to the Ninth Circuit and that no appellate decision was listed."]], "note": "The disclosure concerns a high-level summary, not publication of model weights or source code. Check the court docket before relying on later procedural developments."}, {"eyebrow": "08 · THREE SYSTEMS, THREE PRESSURES", "title": "The rules are not<br>identical everywhere", "compare": [["EUROPEAN UNION", "Layered duties under the AI Act, plus explanations and balancing of trade-secret claims under the CJEU's C-203/22 ruling.", "DISCLOSURE WITH SAFEGUARDS"], ["UNITED STATES · CALIFORNIA", "AB 2013 requires a broad training-data overview; the xAI challenge tests the limits of that disclosure.", "PUBLIC SUMMARY UNDER CHALLENGE"], ["INDIA", "The report identifies no dedicated trade-secrets statute. Protection relies substantially on breach of confidence and contract.", "CONTRACTS + CONFIDENTIALITY"]], "pull": "For firms operating across borders, one secrecy policy may not fit every legal environment."}, {"eyebrow": "09 · FROM LAW TO MANAGEMENT", "title": "What should AI<br>businesses actually do?", "lead": "Trade-secret protection should be designed into the way an AI product is built, documented and explained.", "actions": [["DEFINE THE SECRET", "Identify precisely what is confidential: datasets, filters, model internals or other know-how."], ["PROVE YOU PROTECT IT", "Use access controls, confidentiality agreements and records showing reasonable steps."], ["PREPARE FOR DIFFERENT AUDIENCES", "Maintain a public summary, a confidential regulator file and a plain-language explanation for affected people."], ["EXPLAIN THE DECISION", "Describe the procedure and principles applied; do not assume that sharing an algorithm is enough."], ["PLAN FOR DISCLOSURE", "Decide in advance what can be disclosed without exposing sensitive details."], ["PROTECT INPUTS", "Use appropriate contract clauses, acceptable-use policies and enterprise tools that restrict training on company inputs."]], "note": "These are the report's managerial recommendations, drawn from the legal frameworks and cases it discusses."}, {"eyebrow": "10 · THE BIGGER PICTURE", "title": "The SDG connection", "lead": "The way AI secrecy is managed can affect innovation, equality and accountable institutions.", "sdgs": [["SDG 16", "PEACE, JUSTICE & STRONG INSTITUTIONS", "The strongest link: people need routes to challenge automated decisions, and institutions need access to evidence.", "16.3 · 16.6 · 16.10"], ["SDG 10", "REDUCED INEQUALITIES", "If a system produces unequal outcomes, secrecy can make those patterns harder to identify and contest.", "10.3"], ["SDG 9", "INDUSTRY, INNOVATION & INFRASTRUCTURE", "Protecting legitimate trade secrets can preserve incentives to invest in research and technological development.", "9.5"]], "pull": "Layered disclosure aims to preserve the innovation benefit of SDG 9 while supporting the accountability goals of SDGs 16 and 10."}, {"eyebrow": "11 · OUR CONCLUSION", "title": "Keep the secret.<br>Open the right doors.", "lead": "AI trade secrecy is not an all-or-nothing choice between innovation and accountability.", "blocks": [["WHAT THE EVIDENCE SUGGESTS", "Public summaries, confidential regulatory access and meaningful explanations can coexist with protection for commercially sensitive information."], ["WHAT STILL NEEDS ATTENTION", "A summary may not be enough to audit a system. Authorities need technical capacity. Legal protection also differs across countries."], ["OUR POSITION", "The strongest approach is controlled, layered disclosure: protect genuine commercial secrets, but do not let secrecy prevent people and institutions from questioning decisions that affect them."]], "pull": "A system can remain commercially protected without becoming impossible to question."}, {"eyebrow": "12 · SOURCES & CREDITS", "title": "Research trail", "refs": ["Angwin, J., Larson, J., Mattu, S., & Kirchner, L. (2016). Machine bias. ProPublica.", "Center for AI and Digital Policy. Training Data Transparency (AB 2013).", "EU Artificial Intelligence Act. Articles 53 and 86.", "European Commission. General-purpose AI obligations under the AI Act; enforcement FAQ.", "European Union. (2016). Directive (EU) 2016/943, Article 2.", "Harvard Law Review. (2017). State v. Loomis.", "International Association of Privacy Professionals. (2026). xAI v. Bonta: A constitutional clash for training data transparency.", "Sharma, P. (2026). The hidden cost of Ctrl+V: Trade secrets, AI and limited remedies. Bar & Bench.", "United Nations. Sustainable Development Goals 9, 10 and 16.", "World Trade Organization. TRIPS Agreement, Article 39."], "credits": "MANAGEMENT OF IP IN DIGITAL MEDIA · MGT402/4002<br>Submitted to Professor Vinita Krishna · Group 12<br><br>Ayush Prabhakar · Khushi Aggarwal · Leisha Anand<br>Nikhil Agrawal · Punuru Shyam Suchit Reddy · Ravi Vichitra"}];

  const N = pages.length;
  const pad = n => String(n).padStart(2, "0");
  const plain = s => (s || "").replace(/<br>/g, " ");
  const lockSVG = (sz = 44) => `<svg viewBox="0 0 44 44" aria-hidden="true"><path class="shackle" d="M13 20v-6a9 9 0 0 1 18 0v6" fill="none" stroke="#2E1838" stroke-width="3.2" stroke-linecap="round"/><rect x="9" y="20" width="26" height="19" rx="3" fill="#A65D7B"/><circle cx="22" cy="28" r="2.6" fill="#2E1838"/><rect x="21" y="29" width="2" height="5" fill="#2E1838"/></svg>`;
  const keyholeSVG = `<svg class="keyhole" viewBox="0 0 30 46" aria-hidden="true"><circle cx="15" cy="13" r="10" fill="#A65D7B"/><path d="M9 18 L6 44 H24 L21 18 Z" fill="#A65D7B"/></svg>`;

  function frontHTML(p, i) {

      return `<div class="pg cover">
        <div class="vault" aria-hidden="true"><svg viewBox="0 0 360 360"><circle cx="180" cy="180" r="170" fill="none" stroke="#8CC9BD" stroke-opacity=".35"/><circle cx="180" cy="180" r="130" fill="none" stroke="#8CC9BD" stroke-opacity=".5"/><g class="dial">${Array.from({ length: 60 }, (_, k) => { const a = k * 6 * Math.PI / 180, r1 = k % 5 ? 122 : 112; return `<line x1="${180 + Math.cos(a) * r1}" y1="${180 + Math.sin(a) * r1}" x2="${180 + Math.cos(a) * 128}" y2="${180 + Math.sin(a) * 128}" stroke="#8CC9BD" stroke-opacity=".6"/>`; }).join("")}<line x1="180" y1="180" x2="180" y2="76" stroke="#8CC9BD" stroke-width="2"/></g><circle cx="180" cy="180" r="60" fill="#2E1838" stroke="#8CC9BD" stroke-opacity=".7"/><circle cx="180" cy="168" r="14" fill="#8CC9BD" fill-opacity=".85"/><path d="M172 176 L166 214 H194 L188 176 Z" fill="#8CC9BD" fill-opacity=".85"/></svg></div>
        <div class="eyebrow">${p.eyebrow}</div>
        <div><h1>${p.title}</h1><div class="sub">${p.subtitle}</div><p class="question">${p.body}</p>

    let b = `<div class="eyebrow">${p.eyebrow}</div><h2>${p.title}</h2>`;

    if (p.steps) b += `<div class="locks" data-locks>${p.steps.map((x, k) => `<div class="lock"><button class="lockbtn" type="button" aria-pressed="true" aria-label="${x[1]}: condition met. Tap to remove it.">${lockSVG()}</button><div><span class="num">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join("")}</div><div class="lock-status ok" data-status aria-live="polite"></div><p class="hint">Tap a lock to see what happens when one condition fails.</p>`;

    if (p.chart) b += `<div class="chart" data-chart role="img" aria-label="Defendants who did not re-offend but were labelled higher risk: 44.9% of Black defendants, 23.5% of white defendants"><div class="barrow"><span>Black defendants</span><div class="track"><div class="fill" data-w="${44.9 / 50 * 100}"></div></div><strong>44.9%</strong></div><div class="barrow"><span>White defendants</span><div class="track"><div class="fill" data-w="${23.5 / 50 * 100}"></div></div><strong>23.5%</strong></div><div class="axis"><span></span><div><span>0%</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50%</span></div><span></span></div></div>`;
    if (p.timeline) b += `<div class="timeline">${p.timeline.map(x => `<div class="event"><i></i><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>`;
    if (p.compare) b += `<div class="compare">${p.compare.map((x, k) => `<div class="card"><span class="mono">${["EU", "US", "IN"][k]}</span><div><b>${x[0]}</b><p>${x[1]}</p><em>${x[2]}</em></div></div>`).join("")}</div>`;
    if (p.actions) b += `<div class="actions" data-actions>${p.actions.map((x, k) => `<button class="action" type="button" aria-pressed="false"><i>${pad(k + 1)}</i><span><b>${x[0]}</b>${x[1]}</span><span class="box" aria-hidden="true"></span></button>`).join("")}</div><div class="readiness" data-ready><span></span><div class="meter"><i></i></div></div>`;
    if (p.sdgs) b += `<div class="sdgs">${p.sdgs.map(x => `<div class="sdg"><div class="num"><small>SDG</small>${x[0].replace("SDG ", "")}</div><div><b>${x[1]}</b><p>${x[2]}</p><small class="t">Targets ${x[3]}</small></div></div>`).join("")}</div>`;
    if (p.refs) b += `<ol class="refs">${p.refs.map(x => `<li>${x}</li>`).join("")}</ol><div class="credits">${p.credits}</div>`;
    if (p.note) b += `<p class="note">${p.note}</p>`;
    if (p.pull) b += `<div class="pull">${p.pull}</div>`;
    return `<div class="pg">${b}<span class="pagenum">${pad(i + 1)} / ${pad(N)}</span><div class="curl"></div></div>`;
  }
  function backHTML(p, i) {
    if (i === 0) {
      return `<div class="pg toc"><div class="eyebrow">Inside cover</div><h3>Contents</h3><ol>${pages.slice(1).map((q, k) => `<li><button type="button" data-go="${k + 1}"><span class="n">${pad(k + 2)}</span><span class="t">${plain(q.title)}</span><span class="k">${q.eyebrow.replace(/^\d+ · /, "")}</span></button></li>`).join("")}</ol><span class="pagenum l">Group 12 · MGT402/4002</span></div>`;
    }
    if (i === N - 1) return `<div class="pg"></div>`;
    const line = p.pull || p.note || p.lead || "";
    const m = p.eyebrow.match(/^(\d+) · (.*)$/) || [null, pad(i), p.eyebrow];
    return `<div class="pg verso">${keyholeSVG}<span class="big-n">${m[1]}</span><span class="v-eye">${m[2]}</span><blockquote>${line}</blockquote><span class="rule"></span><span class="sig">Locked Boxes, Open Questions</span><span class="pagenum l">Margin note · page ${pad(i + 1)}</span></div>`;
  }

  /* ===== build ===== */
  const book = document.getElementById("book");
  const leaves = pages.map((p, i) => {
    const leaf = document.createElement("div");
    leaf.className = "leaf" + (i === N - 1 ? " last" : "");
    leaf.innerHTML = `<section class="face front" aria-label="Page ${i + 1}">${frontHTML(p, i)}</section><section class="face back" aria-hidden="true">${backHTML(p, i)}</section>`;

    return leaf;
  });
  let current = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const single = () => matchMedia("(max-width: 900px)").matches;

  function settle() {
    leaves.forEach((l, i) => { const f = i < current; l.style.zIndex = f ? i + 1 : 2 * N - i; l.classList.toggle("is-current", i === current); l.querySelector(".front").setAttribute("aria-hidden", String(i !== current)); l.querySelector(".back").setAttribute("aria-hidden", String(!(f && i === current - 1) || single())); });
  }

    book.classList.toggle("open", current > 0);

  document.getElementById("next").addEventListener("click", next);

  document.addEventListener("keydown", e => {
    if (!document.getElementById("overlay").hidden) { if (e.key === "Escape") closeOv(); return; }

  /* click the left page to go back, the page corner to go forward */

    if (e.target.closest("button, a, .layers, .nest, .actions, .locks")) return;
    const back = e.target.closest(".back"); if (back && !single()) { prev(); return; }
    const front = e.target.closest(".front");
    if (front) { const r = front.getBoundingClientRect(); if (e.clientX > r.right - 70 && e.clientY > r.bottom - 70) next(); }
  });

  /* cover unlock */
  const ob = document.getElementById("openBook");
  ob.addEventListener("click", () => { ob.classList.add("unlocked"); setTimeout(() => goTo(1), reduce ? 0 : 380); });

  /* ===== widgets ===== */
  const locks = book.querySelector("[data-locks]");
  function lockStatus() {
    const btns = [...locks.querySelectorAll(".lockbtn")], on = btns.filter(b => b.getAttribute("aria-pressed") === "true").length;
    const st = book.querySelector("[data-status]");
    const missing = btns.map((b, k) => b.getAttribute("aria-pressed") === "true" ? null : pages[2].steps[k][1].toLowerCase()).filter(Boolean);
    st.className = "lock-status " + (on === 3 ? "ok" : "no");
    st.innerHTML = on === 3 ? `${lockSVG()}<span>All three locks closed: this information qualifies as a trade secret.</span>` : `<span>${on} of 3 locks closed. Without ${missing.join(" and ")}, the information does not qualify, whatever the company calls it.</span>`;
    const svg = st.querySelector("svg"); if (svg) { svg.style.width = "22px"; svg.style.height = "22px"; }
  }
  locks.querySelectorAll(".lockbtn").forEach((b, k) => b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on));
    b.setAttribute("aria-label", `${pages[2].steps[k][1]}: condition ${on ? "met. Tap to remove it." : "not met. Tap to restore it."}`);
    b.closest(".lock").classList.toggle("off", !on);
    lockStatus();
  }));
  lockStatus();

  const nest = book.querySelector("[data-nest]");
  function pickLayer(k) {
    nest.querySelectorAll(".nest-box").forEach(r => r.classList.toggle("on", +r.dataset.k === k));
    nest.querySelectorAll(".layer").forEach(r => r.classList.toggle("on", +r.dataset.k === k));
  }
  nest.addEventListener("click", e => { const t = e.target.closest("[data-k]"); if (t) pickLayer(+t.dataset.k); });
  nest.addEventListener("mouseover", e => { const t = e.target.closest("[data-k]"); if (t) pickLayer(+t.dataset.k); });
  pickLayer(3);

  const acts = book.querySelector("[data-actions]");
  function ready() {
    const btns = [...acts.querySelectorAll(".action")], n = btns.filter(b => b.getAttribute("aria-pressed") === "true").length;
    const r = book.querySelector("[data-ready]");
    r.querySelector("span").textContent = `${n} of 6 in place`;
    r.querySelector(".meter i").style.width = (n / 6 * 100) + "%";
  }
  acts.querySelectorAll(".action").forEach(b => b.addEventListener("click", () => { b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); ready(); }));
  ready();

  function onShow(i) {
    if (pages[i].chart) setTimeout(() => book.querySelectorAll("[data-chart] .fill").forEach(f => f.style.width = f.dataset.w + "%"), reduce ? 0 : 500);
  }

  /* ===== contents overlay ===== */
  const ov = document.getElementById("overlay"), th = document.getElementById("thumbs");
  let lastFocus = null;
  function openOv() {
    th.innerHTML = pages.map((p, i) => `<button type="button" data-i="${i}" ${i === current ? 'aria-current="page"' : ""}><span class="n">${pad(i + 1)} · ${p.kind === "cover" ? "COVER" : p.eyebrow.replace(/^\d+ · /, "")}</span><span class="t">${plain(p.title)}</span></button>`).join("");
    lastFocus = document.activeElement; ov.hidden = false; document.getElementById("ovClose").focus();
  }
  function closeOv() { ov.hidden = true; if (lastFocus) lastFocus.focus(); }
  document.getElementById("tocBtn").addEventListener("click", openOv);
  document.getElementById("ovClose").addEventListener("click", closeOv);
  ov.addEventListener("click", e => { if (e.target === ov) closeOv(); const b = e.target.closest("[data-i]"); if (b) { closeOv(); goTo(+b.dataset.i); } });

  settle(); ui();
})();
</script>

</body></html>
